<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>AHJ atlas – map</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/leaflet.css"><link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="assets/water.css">
<script src="data/data.js"></script><script src="data/water.js"></script><script src="assets/config.js"></script><script src="assets/leaflet.js"></script><script src="assets/common.js"></script><script src="assets/water-common.js"></script>
<script src="assets/street-view.js"></script><script src="assets/construction-map.js"></script>
</head><body>
<div class="nav" id="nav"></div>
<div id="app">
 <div id="side">
  <div class="sec"><h4>Scope</h4><div class="scopes" id="scopes"></div>
   <div style="margin-top:8px"><input type="search" id="q" placeholder="Search risks, roads, agencies…" style="width:100%"></div>
   <a class="water-map-link" href="water.html" id="water-register-link"></a></div>
  <div class="sec" style="max-height:44%;overflow:auto"><h4>Layers</h4><div id="layers"></div>
   <h4 style="margin-top:10px">Route colored by</h4><div class="scopes"><button id="by-auth" class="on">Permit authority</button><button id="by-land">Land / ROW category</button></div>
   <h4 style="margin-top:10px">Risk severity</h4><div id="sevs" class="scopes"></div>
   <h4 style="margin-top:10px">Risk type</h4><div id="types"></div></div>
  <div class="sec" style="padding:6px 12px;display:flex;align-items:center;gap:8px"><b id="cnt" style="font-size:12px"></b><span style="flex:1"></span><button id="exp" title="Download the filtered risks as CSV">CSV</button></div>
  <div id="list"></div>
 </div>
 <div class="map-shell"><div id="map"></div><div class="legend" id="legend"></div><div class="nobase" id="nobase" role="status" hidden></div></div>
 <div id="detail"></div>
</div>
<script>
nav('map.html');
const GLYPH={'Rail crossing':'R','Rail adjacency':'r','Water crossing':'W','Structure / drainage lead':'S','DOT occupancy':'D','DOT crossing / interchange':'d','Off-ROW / private land':'P','Permit owner unclear':'?','Programme risk':'!','Schedule / cost':'$','Access / constructability':'A'};
const map=L.map('map',{zoomControl:true,preferCanvas:false,maxZoom:19,minZoom:7,zoomSnap:.5});
map.createPane('bounds');map.getPane('bounds').style.zIndex=300;map.createPane('route');map.getPane('route').style.zIndex=410;map.createPane('rr');map.getPane('rr').style.zIndex=430;
function addBasemaps() {
  const hosted = location.protocol === 'https:';
  const sources = hosted ? BASEMAPS.hosted : BASEMAPS.offline;
  const status = $('#nobase');
  const blank = L.layerGroup();
  const layers = Object.fromEntries(sources.map(({name, url, ...options}) => {
    const layer = L.tileLayer(url, {
      maxZoom: map.getMaxZoom(),
      referrerPolicy: 'strict-origin-when-cross-origin',
      ...options,
    });
    let failures = 0;
    layer.on('loading', () => { failures = 0; });
    layer.on('tileerror', () => { failures++; });
    layer.on('tileload', () => { status.hidden = true; });
    layer.on('load', () => {
      if (failures && !layer.getContainer()?.querySelector('.leaflet-tile-loaded')) {
        status.textContent = `${name} tiles unavailable. Try another basemap.`;
        status.hidden = false;
      }
    });
    return [name, layer];
  }));
  layers['No basemap'] = blank;
  (hosted ? layers[sources[0].name] : blank).addTo(map);
  map.on('baselayerchange', () => { status.hidden = true; });
  L.control.layers(layers, {}, {collapsed: false}).addTo(map);
  if (hosted) {
    map.attributionControl.setPrefix(
      '<a href="https://leafletjs.com">Leaflet</a> · <a href="https://www.openstreetmap.org/fixthemap">Report a street map issue</a>'
    );
  }
}
// ---- boundaries ----
const L_counties=L.layerGroup(),L_places=L.layerGroup();
const DCOL={'ODOT District 5':'#f08c00','ODOT District 6':'#1971c2','IDOT District 1':'#2f9e44'};
LP.counties.forEach(c=>L.geoJSON({type:'Feature',geometry:c.geom},{pane:'bounds',style:{color:DCOL[c.dist],weight:2.5,dashArray:'8 5',fillColor:DCOL[c.dist],fillOpacity:.07}})
 .bindTooltip(`<b>${esc(c.name)}</b><br>${esc(c.dist)}`,{sticky:true}).addTo(L_counties));
LP.places.forEach(p=>L.geoJSON({type:'Feature',geometry:p.geom},{pane:'bounds',style:{color:'#495057',weight:1.5,fillColor:'#adb5bd',fillOpacity:.14}})
 .bindTooltip(`<b>${esc(p.name)}, ${p.state}</b><br>${fmt(p.route_ft)} ft of route inside limits`,{sticky:true}).addTo(L_places));
// ---- route ----
const L_route=L.layerGroup();let byAuth=true;
function routePopup(r){return `<b>${esc(r.road||'(no public road in screen)')}</b> ${esc(r.route)}<br><span class="note">${esc(r.f)} · ${r.a}–${r.b} ft (${fmt(r.ft)} ft)</span><hr style="margin:6px 0"><b>${esc(r.cls)}</b><br>Permit lead: ${esc(r.issuer)}<br>${esc([r.place,r.county&&r.county+' Co.',r.twp&&r.twp+' Twp'].filter(Boolean).join(' · '))}`;}
function drawRoute(){L_route.clearLayers();
 if(byAuth)LP.route_runs.forEach(r=>{if(!inScope(r.seg))return;L.polyline(r.c.map(p=>[p[1],p[0]]),{pane:'route',color:CLS_COL[r.cls]||'#444',weight:5,opacity:.92}).bindPopup(routePopup(r)).addTo(L_route)});
 else LP.land_runs.forEach(r=>{const seg=r.f.startsWith('S0')?'Segment0':r.f.startsWith('S1')?'Segment1':'Spurs';if(!inScope(seg))return;L.polyline(r.c.map(p=>[p[1],p[0]]),{pane:'route',color:LAND_COL[r.cat],weight:r.cat==='Private parcel'?7:5,opacity:.92})
  .bindPopup(`<b>${esc(r.cat)}</b><br><span class="note">${esc(r.f)} · ${r.a}–${r.b} ft (${fmt(r.b-r.a)} ft)</span>`).addTo(L_route)});
 legend();}
// ---- reroutes ----
const L_rr=L.layerGroup(),L_rfp=L.layerGroup();
LP.reroutes.filter(r=>r.status!=='withdrawn').forEach(r=>{if(r.c&&r.c.length>1)L.polyline(r.c.map(p=>[p[1],p[0]]),{pane:'rr',color:'#82c91e',weight:5,dashArray:'10 7',opacity:.95}).on('click',()=>openReroute(r.id)).bindTooltip(r.id+' (alternative, conceptual)',{sticky:true}).addTo(L_rr);
 if(r.rfp&&r.rfp.length>1)L.polyline(r.rfp.map(p=>[p[1],p[0]]),{pane:'rr',color:'#fa5252',weight:7,opacity:.45}).bindTooltip(r.id+' – RFP stretch replaced',{sticky:true}).addTo(L_rfp);});
// ---- mapped water crossings ----
const waterLayers = Object.fromEntries(Object.keys(WATER_SITE_CLASSES).map(type => [type, L.layerGroup()]));
const waterMarkers=WATER_CROSSINGS.map(crossing=>{
  const type = crossing.review.classification;
  const label = WATER_SITE_CLASSES[type].label;
  const title = crossing.id + ' · ' + label + ' · ' + crossing.name;
  const {lat, lon} = waterMapPosition(crossing);
  const marker = L.marker([lat,lon],{
    title,
    alt:title,
    icon:L.divIcon({className:'water-marker-icon',html:waterSiteSymbol(type),iconSize:[19,19]}),
    zIndexOffset:950
  }).on('click',()=>openWater(crossing.id))
    .bindTooltip(esc(title),{direction:'top'});
  return { crossing, marker };
});
function drawWater(){
  Object.values(waterLayers).forEach(layer => layer.clearLayers());
  waterMarkers.filter(({crossing})=>inScope(crossing.segment)).forEach(({crossing, marker})=>
    marker.addTo(waterLayers[crossing.review.classification])
  );
  $('#water-register-link').textContent='Water crossing register · '+waterCount()+' points';
}
// ---- screening leads ----
const L_lead=L.layerGroup();
LP.leads.filter(l=>!waterByLegacyId.has(l.id)).forEach(l=>L.marker([l.ll[1],l.ll[0]],{icon:L.divIcon({className:'',html:'<div class="lead">◇</div>',iconSize:[14,14]})}).on('click',()=>openRisk(l.id)).bindTooltip('Lead: '+esc(l.title),{direction:'top'}).addTo(L_lead));
const L_con=L.layerGroup();
const constructionFocus=L.layerGroup().addTo(L_con);
const constructionProjects=new Map(LP.construction.map(project=>[project.id,project]));
const constructionGroups=new Map();
const toLatLng=([lon,lat])=>[lat,lon];
for(const project of constructionProjects.values()){
  const points=constructionView(project)?.points;
  if(!points)continue;
  const pin=points[0].join(',');
  if(!constructionGroups.has(pin))constructionGroups.set(pin,[]);
  constructionGroups.get(pin).push(project);
}
for(const [pin,projects] of constructionGroups){
  const [lon,lat]=pin.split(',').map(Number);
  const title=projects.length===1?projects[0].title:`${projects.length} construction records`;
  const marker=L.marker([lat,lon],{
    title,alt:title,zIndexOffset:975,
    icon:L.divIcon({className:'construction-marker',html:projects.length===1?'C':'C · '+projects.length,iconSize:[projects.length===1?23:39,23]})
  }).on('add',event=>{
    event.target.getElement().setAttribute('aria-label',projects.length===1?title:title+' near '+projects[0].place);
  }).bindTooltip(esc(title),{direction:'top'}).addTo(L_con);
  if(projects.length===1){
    marker.on('click',()=>openConstruction(projects[0].id));
  }else{
    const menu=document.createElement('div');
    menu.className='construction-menu';
    menu.innerHTML='<b>Projects at this map reference</b>'+projects.map(p=>`<button type="button" data-project="${p.id}">${esc(p.title)}</button>`).join('');
    $$('[data-project]',menu).forEach(button=>button.onclick=()=>openConstruction(button.dataset.project));
    marker.bindPopup(menu,{maxWidth:315});
  }
}
// ---- aerial crops ----
const L_img=L.layerGroup();
LP.images.forEach(i=>L.marker([i.ll[1],i.ll[0]],{icon:L.divIcon({className:'',html:'<div class="cam">▣</div>',iconSize:[18,18]})}).on('click',()=>openImage(i.id)).bindTooltip(i.id,{direction:'top'}).addTo(L_img));
// ---- risks ----
const L_risk=L.layerGroup();const mk={};const F={seg:'All',sev:new Set(['Critical','High','Medium']),types:new Set(LP.risks.map(r=>r.type)),q:''};
function inScope(seg){return F.seg==='All'||F.seg===seg}
function riskVisible(r){return inScope(r.seg)&&F.sev.has(r.sev)&&F.types.has(r.type)&&(!F.q||(r.title+' '+r.detail+' '+r.agencies+' '+r.feature+' '+r.type).toLowerCase().includes(F.q))}
LP.risks.forEach(r=>{mk[r.id]=L.marker([r.ll[1],r.ll[0]],{icon:L.divIcon({className:'',html:`<div class="rk ${r.sev}" style="${r.sev==='Medium'?'width:17px;height:17px;line-height:13px;font-size:9px;margin:2px':''}">${GLYPH[r.type]||'•'}</div>`,iconSize:[22,22]}),zIndexOffset:r.sev==='Critical'?800:r.sev==='High'?400:0})
 .on('click',()=>openRisk(r.id)).bindTooltip(`<b>${esc(r.sev)}</b> · ${esc(r.title)}`,{direction:'top'});});
function drawRisks(){L_risk.clearLayers();const vis=LP.risks.filter(riskVisible);vis.filter(r=>!waterByLegacyId.has(r.id)).forEach(r=>mk[r.id].addTo(L_risk));
 const ord={Critical:0,High:1,Medium:2};vis.sort((a,b)=>ord[a.sev]-ord[b.sev]||a.seg.localeCompare(b.seg));
 $('#cnt').textContent=vis.length+' of '+LP.risks.length+' risks';
 $('#list').innerHTML=vis.map(r=>`<div class="item" data-id="${r.id}"><div class="t"><span class="chip ${r.sev}">${r.sev}</span> ${esc(r.title)}</div><div class="m">${esc(r.type)} · ${esc(SEGS[r.seg]||r.seg)} · ${esc(r.station)}</div></div>`).join('');
 $$('#list .item').forEach(e=>e.onclick=()=>openRisk(e.dataset.id,true));window._vis=vis;}
// ---- detail panel ----
function panel(h){constructionFocus.clearLayers();const d=$('#detail');d.innerHTML=h;d.classList.add('open');map.invalidateSize();$$('.thumbs img',d).forEach(i=>i.onclick=()=>lightbox(i.src,i.alt));$$('[data-open]',d).forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.open.split(':');k==='rr'?openReroute(id,true):k==='img'?openImage(id,true):openRisk(id,true)});
 $('.x',d).onclick=()=>{constructionFocus.clearLayers();d.classList.remove('open');setTimeout(()=>map.invalidateSize(),200);history.replaceState(null,'','#')};}
function jdxLink(t){const k=(t||'').split(/[,;(]/)[0].trim();return k?`<a href="jdx.html?q=${encodeURIComponent(k)}" target="_blank">contacts &amp; rules →</a>`:''}
function srcLink(s){return /^https?:/.test(s||'')?`<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s.slice(0,70))}…</a>`:esc(s)}
function openConstruction(id){
  const project=constructionProjects.get(id);
  if(!project)return;
  const view=constructionView(project);
  if(!view)return;
  map.closePopup();
  setLayerVisibility(L_con,true);
  history.replaceState(null,'','#construction='+encodeURIComponent(id));
  const timing=[project.start&&'Start: '+project.start,project.end&&'End: '+project.end].filter(Boolean).join(' · ');
  panel(`<div class="dh"><button class="x" type="button" aria-label="Close construction detail">×</button>
    <span class="chip st">${project.type==='moratorium'?'Pavement restriction':'Planned construction'}</span><h3>${esc(project.title)}</h3><div class="note">${esc(id)} · ${esc(project.seg)}</div></div>
    <div class="dc"><h5>Map view</h5><p>${esc(view.label)}</p>
    <h5>Location</h5><p>${esc(project.road)}</p>${project.station?`<p class="note">${esc(project.station)}</p>`:''}
    ${timing?`<h5>Published timing</h5><p>${esc(timing)}</p>`:''}
    <h5>Permit impact</h5><p>${esc(project.permit_effect)}</p>
    ${view.source?`<p><a href="${esc(view.source)}" target="_blank" rel="noopener">Published project location</a></p>`:''}
    <p><a class="btn construction-card-link" href="construction.html#${encodeURIComponent(id)}">Open project card →</a></p></div>`);
  const target=L.latLngBounds([]);
  if(view.routes){
    for(const route of view.routes){
      const line=L.polyline(route.c.map(toLatLng),{
        pane:'rr',color:'#ad4300',weight:6,dashArray:'10 7',interactive:false
      }).addTo(constructionFocus);
      target.extend(line.getBounds());
    }
  }else{
    for(const point of view.points){
      const center=toLatLng(point);
      L.circleMarker(center,{pane:'rr',radius:15,color:'#ad4300',weight:3,fill:false,interactive:false}).addTo(constructionFocus);
      target.extend(center);
    }
  }
  map.invalidateSize({pan:false});
  if(target.getNorthWest().equals(target.getSouthEast())){
    map.setView(target.getCenter(),16.5,{animate:false});
  }else{
    map.fitBounds(target,{padding:[44,52],maxZoom:16.5,animate:false});
  }
}
function openWater(id,fly){
 const crossing=waterById.get(id);if(!crossing)return;
 const {lat,lon}=waterMapPosition(crossing);
 history.replaceState(null,'','#water='+encodeURIComponent(id));
 if(fly){
   if(crossing.review.classification==='retired' && !map.hasLayer(waterLayers.retired)){
     const archived=$('#layers label[data-water-retired]');
     const control=document.getElementById(archived.htmlFor);
     control.checked=true;
     control.dispatchEvent(new Event('change'));
   }
 }
 panel(`<div class="dh"><button class="x" aria-label="Close crossing">×</button>
 <span class="chip st">${esc(SEGS[crossing.segment])}</span><h3>${esc(crossing.name)}</h3>
 <div class="note">${esc(crossing.id)} · ${esc(crossing.feature)} · ${waterStation(crossing.station)} ft</div></div>
 <div class="dc">${waterSiteReview(crossing)}${waterRelatedLeads(id)}${waterDecision(crossing)}${waterEvidence(crossing)}
 <p class="water-links"><a href="${waterRegisterLink(id)}">Open in water crossing register</a> ·
 <a href="${esc(streetViewLink(lat, lon))}" target="_blank" rel="noopener noreferrer">Google Street View</a></p></div>`);
 if(fly)map.setView([lat,lon],Math.max(map.getZoom(),15),{animate:false});
}
function openRisk(id,fly){if(waterByLegacyId.has(id))return openWater(waterByLegacyId.get(id),true);
 const r=LP.risks.concat(LP.leads).find(x=>x.id===id);if(!r)return;const lead=r.id[0]==='L';history.replaceState(null,'','#risk='+id);if(fly)map.setView([r.ll[1],r.ll[0]],Math.max(map.getZoom(),15),{animate:true});
 $$('#list .item').forEach(e=>e.classList.toggle('sel',e.dataset.id===id));
 panel(`<div class="dh"><button class="x">×</button>${lead?'<span class="chip st">Screening lead (not counted as a risk)</span>':`<span class="chip ${r.sev}">${r.sev}</span>`} <span class="chip st">${esc(r.type)}</span><h3>${esc(r.title)}</h3><div class="note">${esc(SEGS[r.seg]||r.seg)} · ${esc(r.feature)} · ${esc(r.station)} · ${r.id}</div></div>
 <div class="dc"><h5>Why it matters</h5><p>${esc(r.detail)}</p><h5>Agencies / owners</h5><p>${esc(r.agencies)} ${jdxLink(r.agencies)}</p><h5>Close-out / action</h5><p>${esc(r.action)}</p>
 ${railCrossingNote(r.rail_note,true)}
 ${r.reroute&&r.reroute.length?`<h5>Reroute opportunities touching this stretch</h5><p>${r.reroute.map(x=>`<button data-open="rr:${x}">${x}</button>`).join(' ')}</p>`:''}
 ${r.imgs&&r.imgs.length?`<h5>Nearby aerial review crops (NAIP)</h5><div class="thumbs">${r.imgs.map(i=>{const m=LP.images.find(z=>z.id===i);return `<img src="${m.img}" alt="${esc(m.id+': '+m.obs)}">`}).join('')}</div><p class="note">${r.imgs.map(i=>`<a href="#" data-open="img:${i}" onclick="return false">${i}</a>`).join(' · ')}</p>`:''}
 <h5>Source</h5><p class="note">${srcLink(r.source)}</p></div>`);}
function openImage(id,fly){const i=LP.images.find(x=>x.id===id);if(fly)map.setView([i.ll[1],i.ll[0]],16);history.replaceState(null,'','#img='+id);
 panel(`<div class="dh"><button class="x">×</button><span class="chip ${i.pri==='High'?'High':'Medium'}">${esc(i.pri)} priority</span> <span class="chip st">Aerial review</span><h3>${esc(i.id)}</h3><div class="note">${esc(i.seg)} · ${esc(i.feature)} · confidence ${esc(i.conf||'n/a')}</div></div>
 <div class="dc"><div class="thumbs"><img style="width:100%;height:auto" src="${i.img}" alt="${esc(i.id)}"></div><h5>What the image shows</h5><p>${esc(i.obs)}</p>${i.gap?`<h5>Gap / constructability</h5><p>${esc(i.gap)}</p>`:''}<h5>Register status</h5><p>${esc(i.issue)}</p><h5>Follow-up</h5><p>${esc(i.follow)}</p>
 <p class="note">NAIP crop (USGS / USDA FSA). Screening location only; not a surveyed crossing point.</p></div>`);}
function openReroute(id,fly){const r=LP.reroutes.find(x=>x.id===id);if(!r)return;history.replaceState(null,'','#rr='+id);
 if(r.status==='withdrawn'){
   panel(`<div class="dh"><button class="x" aria-label="Close reroute review">×</button><span class="chip st">Withdrawn</span>
   <h3>${esc(r.id)}: ${esc(r.title)}</h3></div><div class="dc"><p>${esc(r.benefit)}</p>
   <div class="thumbs"><img style="width:100%;height:auto" src="${esc(r.map)}" alt="Evidence for withdrawing ${esc(r.id)}"></div>
   <p><a href="report.html#${encodeURIComponent(r.id)}">Read the withdrawal decision and sources</a></p></div>`);
   if(fly)map.setView(r.review_point,13.5,{animate:false});
   return;
 }
 if(fly&&r.c.length>1)map.fitBounds(L.latLngBounds(r.c.map(p=>[p[1],p[0]])).pad(.25));
 const d=r.rfp_ft&&r.alt_ft?r.alt_ft-r.rfp_ft:null;
 panel(`<div class="dh"><button class="x">×</button><span class="chip ok">Reroute opportunity</span> <span class="chip st">${esc(r.seg)}</span><h3>${esc(r.id)}: ${esc(r.title)}</h3><div class="note">Conceptual alignment – not surveyed · confidence ${esc(r.conf)}</div></div>
 <div class="dc">${r.focus?`<p><button type="button" id="reroute-focus">${esc(r.focus.label)}</button></p>`:''}
 ${r.map?`<div class="thumbs"><img style="width:100%;height:auto" src="${r.map}" alt="${esc(r.title)}"></div>`:''}
 <h5>Length</h5><p>RFP stretch ${r.rfp_ft?fmt(r.rfp_ft)+' ft':'–'} → alternative ${r.alt_ft?fmt(r.alt_ft)+' ft':'–'} ${d!=null?`(<b>${d>0?'+':''}${fmt(d)} ft</b>)`:''}</p>
 <h5>Benefit</h5><p>${esc(r.benefit)}</p><h5>Authorities removed</h5><p>${esc(Array.isArray(r.removed)?r.removed.join('; '):r.removed)}</p><h5>Authorities added</h5><p>${esc(Array.isArray(r.added)?r.added.join('; '):r.added)}</p><h5>Risks / unknowns</h5><p>${esc(Array.isArray(r.risks)?r.risks.join('; '):r.risks)}</p>${r.notes?`<h5>Full write-up (street by street, evidence, sources)</h5><div class="notes">${r.notes}</div>`:''}</div>`);
 if(r.focus)$('#reroute-focus').onclick=()=>map.setView(r.focus.point,16.5,{animate:false});
}
// ---- sidebar controls ----
const LAYERS=[['Jurisdiction: counties / ODOT & IDOT districts',L_counties,true,'#1971c2'],['Jurisdiction: cities & villages',L_places,true,'#868e96'],['Route (by authority / land)',L_route,true,'#c0262d'],
 ['Risk flags',L_risk,true,'#e07b00'],
 ...Object.entries(WATER_SITE_CLASSES).map(([type,{label,color}])=>[
   label + ' (' + WATER_CROSSINGS.filter(crossing=>crossing.review.classification===type).length + ')',
   waterLayers[type], type!=='retired', color
 ]),
 ['Reroute alternatives (conceptual)',L_rr,true,'#82c91e'],['RFP stretches replaced by reroutes (red band)',L_rfp,true,'#fa5252'],['Aerial review crops (85 NAIP)',L_img,false,'#3b4a5c'],['Screening leads: structures and unresolved locations',L_lead,false,'#868e96'],['Planned construction (C)',L_con,true,'#ad4300']];
$('#layers').innerHTML=LAYERS.map((l,i)=>`<div class="row"><input type="checkbox" id="ly${i}" ${l[2]?'checked':''}><span class="sw" style="background:${l[3]}"></span><label for="ly${i}" ${l[1]===waterLayers.retired?'data-water-retired':''}>${l[0]}</label></div>`).join('');
LAYERS.forEach((l,i)=>{const cb=$('#ly'+i);const f=()=>cb.checked?l[1].addTo(map):map.removeLayer(l[1]);cb.onchange=f;f();});
function setLayerVisibility(layer,visible){
  const index=LAYERS.findIndex(([,item])=>item===layer);
  const checkbox=$('#ly'+index);
  checkbox.checked=visible;
  checkbox.onchange();
}
$('#sevs').innerHTML=['Critical','High','Medium'].filter(s=>LP.risks.some(r=>r.sev===s)).map(s=>`<button class="on" data-s="${s}" style="border-left:5px solid ${SEV_COL[s]}">${s}</button>`).join('');
$$('#sevs button').forEach(b=>b.onclick=()=>{b.classList.toggle('on');F.sev.has(b.dataset.s)?F.sev.delete(b.dataset.s):F.sev.add(b.dataset.s);drawRisks()});
const types=[...new Set(LP.risks.map(r=>r.type))];
$('#types').innerHTML=types.map((t,i)=>`<div class="row"><input type="checkbox" checked id="ty${i}"><span class="rk Medium" style="width:18px;height:18px;line-height:14px;font-size:10px;background:#5a6b7d;color:#fff">${GLYPH[t]||'•'}</span><label for="ty${i}">${t} <span class="note">(${LP.risks.filter(r=>r.type===t).length})</span></label></div>`).join('');
types.forEach((t,i)=>$('#ty'+i).onchange=e=>{e.target.checked?F.types.add(t):F.types.delete(t);drawRisks()});
const scopes=[['All','All routes'],['Segment0','Segment 0'],['Segment1','Segment 1'],['Spurs','Chicago spurs']];
$('#scopes').innerHTML=scopes.map(s=>`<button data-s="${s[0]}" class="${s[0]==='All'?'on':''}">${s[1]}</button>`).join('');
function bounds(seg){const pts=[];LP.route_lines.forEach(l=>{if(seg==='All'||l.seg===seg)l.c.forEach(p=>pts.push([p[1],p[0]]))});return L.latLngBounds(pts)}
$$('#scopes button').forEach(b=>b.onclick=()=>{$$('#scopes button').forEach(x=>x.classList.remove('on'));b.classList.add('on');F.seg=b.dataset.s;drawRoute();drawRisks();drawWater();map.fitBounds(bounds(F.seg).pad(.08))});
$('#q').oninput=e=>{F.q=e.target.value.toLowerCase().trim();drawRisks()};
$('#by-auth').onclick=()=>{byAuth=true;$('#by-auth').classList.add('on');$('#by-land').classList.remove('on');drawRoute()};
$('#by-land').onclick=()=>{byAuth=false;$('#by-land').classList.add('on');$('#by-auth').classList.remove('on');drawRoute()};
$('#exp').onclick=()=>csv((window._vis||[]).map(r=>({id:r.id,severity:r.sev,type:r.type,segment:r.seg,feature:r.feature,station:r.station,title:r.title,detail:r.detail,agencies:r.agencies,action:r.action,lat:r.ll[1],lon:r.ll[0],source:r.source})),'lp_risk_flags.csv');
function legend(){const cols=byAuth?CLS_COL:LAND_COL;const used=new Set((byAuth?LP.route_runs.map(r=>r.cls):LP.land_runs.map(r=>r.cat)));
 $('#legend').innerHTML='<b>Route</b>'+Object.entries(cols).filter(([k])=>used.has(k)).map(([k,c])=>`<div class="row"><span class="sw line" style="background:${c}"></span>${k}</div>`).join('')
 +'<div class="row"><span class="sw line" style="background:#82c91e"></span>Reroute alternative</div><div class="row" style="margin-top:4px"><span class="sw" style="border:2px dashed #1971c2"></span>ODOT D6</div><div class="row"><span class="sw" style="border:2px dashed #f08c00"></span>ODOT D5</div><div class="row"><span class="sw" style="border:2px dashed #2f9e44"></span>IDOT D1</div>'
 +Object.entries(WATER_SITE_CLASSES).map(([type,{label}])=>`<div class="row">${waterSiteSymbol(type)} ${label}</div>`).join('')}
drawRoute();drawRisks();drawWater();map.fitBounds(bounds('All').pad(.05));
function fromHash(){const [kind,id]=new URLSearchParams(location.hash.slice(1)).entries().next().value||[];const handlers={risk:openRisk,img:openImage,rr:openReroute,water:openWater,construction:openConstruction};if(id&&Object.hasOwn(handlers,kind))handlers[kind](id,true)}fromHash();addEventListener('hashchange',fromHash);
addBasemaps();
addStreetViewPicker(map);
</script></body></html>
